<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Tumble Code{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/app">Tumble&nbsp;Code <span class="brand-sub">Cloud</span></a>
    {% if user %}
      <nav class="mainnav" aria-label="Sections">
        <a href="/app"{% if nav_active == 'tasks' %} class="active" aria-current="page"{% endif %}>Tasks</a>
        <a href="/app/metrics"{% if nav_active == 'metrics' %} class="active" aria-current="page"{% endif %}>Metrics</a>
      </nav>
    {% endif %}
    <div class="spacer"></div>
    {% if user %}
      <span class="user">{{ user.name }}</span>
      <a class="btn ghost" href="/app/logout">Sign out</a>
    {% else %}
      <a class="btn" href="/app/login">Sign in</a>
    {% endif %}
  </header>
  <main class="content{% if read_measure %} read{% endif %}">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
